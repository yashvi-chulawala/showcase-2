<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="100%" height="100%">
  <defs>
    <!-- Rich gradients matching the coral orange and leaf green of the 360 EYE logo -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3694c" />
      <stop offset="100%" stop-color="#ea4931" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cf4e" />
      <stop offset="100%" stop-color="#6bb13a" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Top Horizontal Bar of "3" & Slanted Diagonal Arm -->
    <path d="M 14 6 L 76 6 L 76 15 L 40 15 L 68 52 C 86 58 98 75 98 96 C 98 120 78 138 52 138 C 26 138 6 120 6 96 L 16 96 C 16 114 32 128 52 128 C 72 128 88 114 88 96 C 88 80 76 66 60 62 L 36 32 L 14 6 Z" fill="url(#orangeGrad)" />

    <!-- Outer Circular Arrow Arc (Clockwise with Arrowhead) -->
    <path d="M 22 80 C 26 62 42 50 60 50 C 76 50 90 62 92 78 L 84 78 C 82 66 72 58 60 58 C 46 58 34 68 32 80 Z" fill="url(#orangeGrad)" />
    <!-- Arrowhead Top-Left pointing Down -->
    <polygon points="22,66 32,80 12,80" fill="url(#orangeGrad)" />
    <!-- Arrowhead Bottom-Right pointing Up -->
    <polygon points="80,108 98,108 89,94" fill="url(#orangeGrad)" />

    <!-- Inner Circular Arrow Arc (Counter-Clockwise) -->
    <path d="M 24 94 C 28 108 42 118 58 118 C 74 118 86 108 90 94 L 82 94 C 78 104 68 110 58 110 C 48 110 38 104 34 94 Z" fill="url(#orangeGrad)" />

    <!-- Center Green Eye Circle -->
    <circle cx="52" cy="88" r="22" fill="url(#greenGrad)" />
    
    <!-- White Crescent Iris Highlight in Center -->
    <path d="M 44 80 C 38 88 42 100 52 102 C 62 100 66 88 60 80 C 64 88 60 96 52 98 C 44 96 40 88 44 80 Z" fill="#ffffff" />
  </g>

  <!-- "360 EYE" Green Lettering -->
  <text x="60" y="136" text-anchor="middle" fill="url(#greenGrad)" font-family="'Outfit', 'Arial Black', -apple-system, sans-serif" font-weight="900" font-size="18" letter-spacing="1">360 EYE</text>
</svg>
