<!DOCTYPE html>
<html>
<head>
	<title>Showcase 360 Virtual Tour</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
	<meta http-equiv="x-ua-compatible" content="IE=edge" />
	<style>
		html { height:100%; }
		body { height:100%; overflow:hidden; margin:0; padding:0; font-family:Arial, Helvetica, sans-serif; font-size:16px; color:#FFFFFF; background-color:#000000; }
	</style>
	<link rel="stylesheet" href="assets/voice-agent.css">
</head>
<body>

<script src="tour.js"></script>

<div id="pano" style="width:100%;height:100%;">
	<noscript><table style="width:100%;height:100%;"><tr style="vertical-align:middle;"><td><div style="text-align:center;">ERROR:<br/><br/>Javascript not activated<br/><br/></div></td></tr></table></noscript>
	<script>
		embedpano({xml:"tour.xml", target:"pano", html5:"only", mobilescale:1.0, passQueryParameters:"startscene,startlookat", onready: function(krpanoObj) {
			window.krpano = krpanoObj;

			// Initialize AI Proactive Visitor Engagement System
			window.visitorTracker = new window.VisitorBehaviorTracker();
			window.engagementDetector = new window.EngagementDetector(window.visitorTracker);
			window.voiceTriggerManager = new window.VoiceTriggerManager(window.engagementDetector, window.sceneRegistry);
			window.engagementDetector.start();

			fetch('/api/tours/default/scenes')
				.then(function(r) { return r.json(); })
				.then(function(data) {
					var scenes = data.scenes || [];
					if (window.sceneRegistry) {
						window.sceneRegistry.registerScenes(scenes);
						if (scenes.length > 0) {
							window.sceneRegistry.setCurrentScene(scenes[0]._id);
							if (window.visitorTracker) window.visitorTracker.onSceneChange(scenes[0]._id);
						}
					}
				})
				.catch(console.error);

			window.appNavigation = {
				navigateToPano: function(targetSceneId) {
					if (!targetSceneId || !window.krpano) return;
					fetch('/api/scenes/' + targetSceneId)
						.then(function(r) { return r.json(); })
						.then(function(data) {
							var scene = data.scene;
							if (scene && window.krpano.call) {
								var baseName = scene.tilesFolder ? scene.tilesFolder.replace(/\.tiles$/i, '') : scene.title;
								var krName = 'scene_' + baseName;
								console.log('[Standalone tour] Voice navigating to:', krName);
								window.krpano.call("loadscene('" + krName + "', null, MERGE, BLEND(0.5, easeInCubic));");
								if (window.sceneRegistry) {
									window.sceneRegistry.setCurrentScene(scene._id);
								}
								if (window.visitorTracker) {
									window.visitorTracker.onSceneChange(scene._id);
								}
							}
						})
						.catch(console.error);
				}
			};
		}});
	</script>
</div>


<script src="assets/voice-agent.js"></script>
</body>
</html>
