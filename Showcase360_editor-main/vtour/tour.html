		/* Bouncing Pin and Glow CSS */

	<div id="pano" style="width:100%;height:100%;">
		<noscript>
			<table style="width:100%;height:100%;">

						<div style="text-align:center;">ERROR:<br /><br />Javascript not activated<br /><br /></div>
					</td>

			</table>
		</noscript>

		<!-- Custom Top Bar -->
		<div id="top-bar">
			<div class="top-bar-left">
				<button class="custom-btn" id="map-toggle-btn" onclick="toggleMap()">
					<svg viewBox="0 0 24 24">
						<path
							d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z" />
					</svg>
					<span id="map-toggle-text">Map</span>
				</button>
			</div>
			<div class="top-bar-center">
				<div id="top-bar-title">Loading...</div>
			</div>
			<div style="width: 82px;"></div>

		</div>

		<!-- Map UI -->
		<div id="map-modal">
			<button id="map-close-btn" onclick="toggleMap()">X</button>
			<div id="map-container"></div>
		</div>

		<script>
			// Krpano object reference
			let krpano = null;

			function krpanoReady(krpanoInterface) {
				krpano = krpanoInterface;
				window.krpano = krpanoInterface; // Attach to window for voice-assistant.js
				// Hide default skin immediately
				krpano.set("layer[skin_layer].visible", false);

				// Add listener for scene changes to update map pin and title
				krpano.set("events[map_events].keep", true);
				krpano.set("events[map_events].onxmlcomplete", "js(plotKrpanoScenes())");
				krpano.set("events[map_events].onnewscene", "js(updateActiveSceneInfo())");

				// Try to plot pins if map is already initialized
				if (typeof google !== 'undefined' && mapInitialized) {
					plotKrpanoScenes();
				}
			}

			embedpano({ xml: "tour.xml", target: "pano", html5: "only", mobilescale: 1.0, passQueryParameters: "startscene,startlookat", onready: krpanoReady });
		</script>
	</div>

	<!-- Google Maps Integration JS -->
	<script>
		let map;
		let markers = {};
		let mapInitialized = false;

		function toggleMap() {
			const modal = document.getElementById('map-modal');
			const btnText = document.getElementById('map-toggle-text');
			const isOpen = modal.classList.contains('map-open');
			if (isOpen) {
				modal.classList.remove('map-open');
				if (btnText) btnText.textContent = 'Map';
			} else {
				modal.classList.add('map-open');
				if (btnText) btnText.textContent = 'Close';
				if (map) {
					// Trigger resize so map renders correctly after slide-in
					setTimeout(() => {
						google.maps.event.trigger(map, 'resize');
						centerMapOnActiveScene();
					}, 380); // Wait for transition to complete
				}
			}
		}

		async function initMap() {
			// Import AdvancedMarkerElement
			const { Map } = await google.maps.importLibrary("maps");
			const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

			// Make PinElement globally available for later use
			window.PinElement = PinElement;
			window.AdvancedMarkerElement = AdvancedMarkerElement;

			map = new Map(document.getElementById("map-container"), {
				center: { lat: 0, lng: 0 },
				zoom: 12,
				mapTypeId: 'hybrid', // Satellite with labels
				mapTypeControl: false, // Remove Map/Satellite toggle buttons
				mapId: 'DEMO_MAP_ID' // Required for Advanced Markers
			});

			mapInitialized = true;

			if (krpano) {
				plotKrpanoScenes();
			}
		}

		let scenesPlotted = false;

		function plotKrpanoScenes() {
			if (!krpano || !mapInitialized || scenesPlotted) return;

			const sceneCount = krpano.get("scene.count");
			if (!sceneCount || sceneCount === 0) return; // Wait for onxmlcomplete

			scenesPlotted = true;
			const bounds = new google.maps.LatLngBounds();
			let validPins = 0;

			for (let i = 0; i < sceneCount; i++) {
				const sceneName = krpano.get(`scene[${i}].name`);
				let lat = krpano.get(`scene[${i}].lat`);
				let lng = krpano.get(`scene[${i}].lng`);

				if (lat !== null && lng !== null && lat !== "" && lng !== "") {
					lat = parseFloat(lat);
					lng = parseFloat(lng);

					if (!isNaN(lat) && !isNaN(lng)) {
						// Create default blue pin
						const pin = new window.PinElement({
							background: "#4285F4", // Blue
							borderColor: "#1967D2",
							glyphColor: "white"
						});

						const marker = new window.AdvancedMarkerElement({
							map: map,
							position: { lat: lat, lng: lng },
							title: krpano.get(`scene[${i}].title`) || sceneName,
							content: pin.element
						});

						// Add click event to load scene
						marker.addListener('click', () => {
							krpano.call(`loadscene(${sceneName}, null, MERGE, BLEND(0.5))`);
						});

						markers[sceneName] = { marker, pin, lat, lng };
						bounds.extend({ lat, lng });
						validPins++;
					}
				}
			}

			if (validPins > 0) {
				map.fitBounds(bounds);
			}

			// Highlight the current scene immediately if one is loaded
			updateActiveSceneInfo();
		}

		function updateActiveSceneInfo() {
			if (!krpano || !mapInitialized) return;

			const currentSceneName = krpano.get("xml.scene");
			const currentSceneTitle = krpano.get(`scene[${currentSceneName}].title`) || currentSceneName;

			// Update HTML Title in Top Bar
			const titleEl = document.getElementById("top-bar-title");
			if (titleEl) {
				titleEl.textContent = currentSceneTitle;
			}

			// Ensure default skin is hidden
			krpano.set("layer[skin_layer].visible", false);

			// Reset all pins to blue
			for (const sceneName in markers) {
				const m = markers[sceneName];
				// Create a new pin element to reset
				const resetPin = new window.PinElement({
					background: "#4285F4",
					borderColor: "#1967D2",
					glyphColor: "white"
				});
				m.marker.content = resetPin.element;
				m.marker.content.classList.remove('pin-active-glow');
				m.marker.zIndex = 1;
			}

			// Set active pin to gold and glowing
			if (currentSceneName && markers[currentSceneName]) {
				const activeM = markers[currentSceneName];
				const activePin = new window.PinElement({
					background: "#FFD700", // Bright Gold
					borderColor: "#F59E0B",
					glyphColor: "white"
				});

				// Structure the bouncing pin and ground shadow glow
				const contentWrapper = document.createElement('div');
				contentWrapper.className = 'pin-active-wrapper';

				const shadowGlow = document.createElement('div');
				shadowGlow.className = 'pin-shadow-glow';

				const pinContainer = document.createElement('div');
				pinContainer.className = 'pin-bounce';
				pinContainer.appendChild(activePin.element);

				contentWrapper.appendChild(shadowGlow);
				contentWrapper.appendChild(pinContainer);

				activeM.marker.content = contentWrapper;
				activeM.marker.zIndex = 100;
			}
		}

		function centerMapOnActiveScene() {
			if (!krpano || !map) return;
			const currentSceneName = krpano.get("xml.scene");
			if (currentSceneName && markers[currentSceneName]) {
				map.setCenter({ lat: markers[currentSceneName].lat, lng: markers[currentSceneName].lng });
			}
		}
	</script>
	<script async defer
		src="https://maps.googleapis.com/maps/api/js?key= AIzaSyADj8Ydma7BpqC7-wbggzXRTP1ZZ0j7osA&callback=initMap&libraries=marker"></script>
