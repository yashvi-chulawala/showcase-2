		/* Completely hide and remove default krpano control bar and skin */
		#krpanoSWFObject div[style*="skin_control_bar"],

		.leaflet-pin-wrapper {

		/* Bouncing Pin and Glow CSS */
		.pin-active-wrapper {
			position: relative;
			width: 32px;
			height: 50px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: flex-end;
		}

		.pin-bounce {
			animation: pin-jump 0.5s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
			z-index: 2;
		}

		.pin-shadow-glow {
			position: absolute;
			bottom: -4px;
			left: 50%;
			width: 24px;
			height: 10px;
			background: rgba(255, 215, 0, 1);
			box-shadow: 0 0 22px 10px rgba(255, 215, 0, 0.7);
			border-radius: 50%;
			filter: blur(2px);
			animation: shadow-jump 0.5s infinite alternate cubic-bezier(0.5, 0.05, 1, 0.5);
			z-index: 1;
		}

		@keyframes pin-jump {
			0% {

		@keyframes shadow-jump {

	<div id="pano" style="width:100%;height:100%;">

		<!-- Custom Top Bar -->
		<div id="top-bar">
			<div class="top-bar-left">
				<button class="custom-btn" id="map-toggle-btn" onclick="toggleMap()">
					<svg viewBox="0 0 24 24">
						<path
							d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z" />

					<span id="map-toggle-text">Map</span>

		</div>

		<div id="map-modal">
			<button id="map-close-btn" onclick="toggleMap()">X</button>
			<div id="map-container"></div>
		</div>

		<script>
			// Krpano object reference
			let krpano = null;

			function krpanoReady(krpanoInterface) {
				krpano = krpanoInterface;
				window.krpano = krpanoInterface; // Attach to window for voice-assistant.js
				
				// Hide default skin immediately and keep hidden
				krpano.set("layer[skin_layer].visible", false);
				krpano.set("layer[skin_control_bar].visible", false);
				krpano.set("layer[skin_splitter_bottom].visible", false);
				krpano.set("events[skin_events].onnewscene", "set(layer[skin_layer].visible, false); set(layer[skin_control_bar].visible, false);");

				// Add listener for scene changes to update map pin and title
				krpano.set("events[map_events].keep", true);
				krpano.set("events[map_events].onxmlcomplete", "js(onKrpanoXmlReady())");
				krpano.set("events[map_events].onnewscene", "js(onKrpanoNewScene())");
			}

			function onKrpanoXmlReady() {
				if (krpano) {
					krpano.set("layer[skin_layer].visible", false);
					krpano.set("layer[skin_control_bar].visible", false);
				}
				if (leafletMap) {
					plotLeafletScenes();
				}
			}

			function onKrpanoNewScene() {
				if (krpano) {
					krpano.set("layer[skin_layer].visible", false);
					krpano.set("layer[skin_control_bar].visible", false);
				}
				updateActiveSceneInfo();
			}

			embedpano({ xml: "tour.xml", target: "pano", html5: "only", mobilescale: 1.0, passQueryParameters: "startscene,startlookat", onready: krpanoReady });
		</script>

	<!-- Leaflet Fallback CSS & JS -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

	<!-- Google Satellite Map JS -->
	<script>
		let leafletMap = null;
		let leafletMarkers = {};

		function createTeardropPin(color, isActive = false) {
			const pinSvg = `
				<svg viewBox="0 0 28 40" width="28" height="40" style="display: block; filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.5));">
					<path d="M14 0C6.268 0 0 6.268 0 14c0 10.5 14 26 14 26s14-15.5 14-26c0-7.732-6.268-14-14-14z" fill="${color}" stroke="#ffffff" stroke-width="1.5"/>
					<circle cx="14" cy="14" r="5" fill="#ffffff"/>
				</svg>
			`;

			if (isActive) {
				return L.divIcon({
					className: 'leaflet-pin-wrapper',
					html: `
						<div class="pin-active-wrapper">
							<div class="pin-shadow-glow"></div>
							<div class="pin-bounce">
								${pinSvg}
							</div>
						</div>
					`,
					iconSize: [32, 50],
					iconAnchor: [16, 45]
				});
			}

			return L.divIcon({
				className: 'leaflet-pin-wrapper',
				html: `<div style="cursor: pointer;">${pinSvg}</div>`,
				iconSize: [28, 40],
				iconAnchor: [14, 40]
			});
		}

		function toggleMap() {
			const modal = document.getElementById('map-modal');
			const btnText = document.getElementById('map-toggle-text');
			const isOpen = modal.classList.contains('map-open');
			if (isOpen) {
				modal.classList.remove('map-open');
				if (btnText) btnText.textContent = 'Map';
			} else {
				modal.classList.add('map-open');
				if (btnText) btnText.textContent = 'Close';
				if (!leafletMap) {
					initLeafletMap();
				}
				setTimeout(() => {
					if (leafletMap) {
						leafletMap.invalidateSize();
						plotLeafletScenes();
						centerLeafletOnActiveScene();
					}
				}, 380);
			}
		}

		function initLeafletMap() {
			if (leafletMap) return;
			const container = document.getElementById('map-container');
			if (container) container.innerHTML = '';

			leafletMap = L.map('map-container', {
				zoomControl: true,
				attributionControl: false
			}).setView([21.146, 72.765], 14);

			// Google Satellite with Labels (Hybrid)
			L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
				maxZoom: 20,
				subdomains: ['0', '1', '2', '3']
			}).addTo(leafletMap);

			if (krpano) plotLeafletScenes();
		}

		function plotLeafletScenes() {
			if (!krpano || !leafletMap) return;
			const sceneCount = krpano.get("scene.count");
			if (!sceneCount || sceneCount === 0) return;

			// Clear previous markers before plotting fresh
			for (const s in leafletMarkers) {
				if (leafletMarkers[s] && leafletMarkers[s].marker) {
					leafletMap.removeLayer(leafletMarkers[s].marker);
				}
			}
			leafletMarkers = {};

			const latLngs = [];
			for (let i = 0; i < sceneCount; i++) {
				const sceneName = krpano.get(`scene[${i}].name`);
				let lat = krpano.get(`scene[${i}].lat`);
				let lng = krpano.get(`scene[${i}].lng`);

			L.control.zoom({ position: 'bottomright' }).addTo(leafletMap);

			const markerData = getCustomMarkerData();
			const latlngs = [];

			for (const sceneName in markerData) {
				const data = markerData[sceneName];
				const latlng = [data.lat, data.lng];
				latlngs.push(latlng);

				const marker = L.marker(latlng, {
					icon: createTeardropPin('#3b82f6', false),
					title: data.title
				}).addTo(leafletMap);

				marker.bindTooltip(data.title, {
					permanent: false,
					direction: 'top',
					offset: [0, -25],
					className: 'custom-map-tooltip'
				});

				marker.on('click', () => {
					if (window.krpano) {
						window.krpano.call(`loadscene('${sceneName}', null, MERGE, BLEND(0.5));`);
					}
					toggleMapModal();
				});

				leafletMarkers[sceneName] = { marker: marker, lat: data.lat, lng: data.lng, title: data.title };
			}

			if (latlngs.length > 1) {
				currentPolyline = L.polyline(latlngs, {
					color: '#f59e0b',
					weight: 3,
					opacity: 0.7,
					dashArray: '5, 8'
				}).addTo(leafletMap);
			}

			setTimeout(() => {
				leafletMap.invalidateSize();
				updateActiveSceneMarker();
			}, 300);
		}

		function toggleMapModal() {
			const modal = document.getElementById('map-modal');
			if (!modal) return;
			isMapModalOpen = !isMapModalOpen;
			modal.style.display = isMapModalOpen ? 'block' : 'none';

			if (isMapModalOpen) {
				if (!leafletMap) {
					initLeafletMap();
				} else {
					setTimeout(() => {
						leafletMap.invalidateSize();
						centerLeafletOnActiveScene();
					}, 200);
				}
			}
		}

		function updateActiveSceneMarker() {
			if (!window.krpano) return;
			const kr = window.krpano;
			const currentSceneName = kr.get("xml.scene");
			const currentSceneTitle = kr.get(`scene[${currentSceneName}].title`) || currentSceneName;

			const titleEl = document.getElementById('current-scene-title');
			if (titleEl) {
				titleEl.textContent = currentSceneTitle;
			}

			kr.set("layer[skin_layer].visible", false);
			kr.set("layer[skin_control_bar].visible", false);

			if (leafletMap) {
				for (const sName in leafletMarkers) {
					const m = leafletMarkers[sName];
					const isActive = sName === currentSceneName;
					m.marker.setIcon(createTeardropPin(isActive ? '#FFD700' : '#3b82f6', isActive));
					if (isActive) m.marker.setZIndexOffset(1000);
					else m.marker.setZIndexOffset(1);
				}
			}
		}

		function centerLeafletOnActiveScene() {
			if (!window.krpano || !leafletMap) return;
			const currentSceneName = window.krpano.get("xml.scene");
			if (currentSceneName && leafletMarkers[currentSceneName]) {
				leafletMap.panTo([leafletMarkers[currentSceneName].lat, leafletMarkers[currentSceneName].lng]);
			}
		}

		setTimeout(() => {
			if (!leafletMap) {
				initLeafletMap();
			}
		}, 1500);
	</script>

	<!-- Voice Agent -->
	<script src="assets/voice-agent.js?v=52"></script>
